[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pelicanbench"
version = "0.4.0a1"
description = "A longitudinal, compositional and agentic visual-generation benchmark."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Dylan Mordaunt"}]
keywords = ["benchmark", "multimodal", "svg", "agentic-drawing", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cairosvg>=2.7",
  "defusedxml>=0.7.1",
  "jsonschema>=4.23",
  "numpy>=2.1",
  "pillow>=11.0",
  "pydantic>=2.10",
  "typer>=0.15",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14"]
hub = ["datasets>=3.2", "huggingface-hub>=0.27", "gradio>=5.0"]
image = []
dev = [
  "coverage[toml]>=7.6",
  "hypothesis>=6.125",
  "mypy>=1.13",
  "pyright>=1.1.395",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-randomly>=3.16",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
  "ruff>=0.9",
]
mutation = [
  "mutmut>=3.2",
]

[project.scripts]
pelicanbench = "pelicanbench.cli:app"

[project.urls]
Homepage = "https://github.com/edithatogo/pelican-bench"
Repository = "https://github.com/edithatogo/pelican-bench"
Issues = "https://github.com/edithatogo/pelican-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pelicanbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --showlocals"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "unit: isolated deterministic component tests",
  "integration: cross-component tests without live production dependencies",
  "e2e: complete benchmark or study workflow tests",
  "property: generative or exhaustive invariant tests",
  "mutation: mutation-killing sentinel tests",
  "edge: boundary, malformed-input, and resource-limit tests",
  "dst: deterministic simulation testing",
  "contract: consumer-driven provider contract tests",
  "metamorphic: tests over semantics-preserving transformations",
  "agent: tests of tool-using drawing agents and trajectories",
  "autonomous: tests of bounded autonomous planning and recovery",
  "network: tests requiring explicitly enabled network access",
  "slow: computationally expensive tests",
]

[tool.coverage.run]
branch = true
source = ["pelicanbench"]
parallel = true
relative_files = true

[tool.coverage.paths]
source = ["src/pelicanbench", "*/site-packages/pelicanbench"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
# Keep the formatter's syntax target at the oldest grammar it can safely
# normalize; the package/runtime support contract remains Python 3.14+.
target-version = "py313"
line-length = 100
extend-exclude = [".agents/plugins/conductor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pelicanbench"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["pelicanbench"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["cairosvg", "defusedxml", "defusedxml.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]
exclude = [".agents/plugins/conductor", "artifacts", "dist"]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"

[tool.mutmut]
source_paths = ["src/pelicanbench"]
only_mutate = [
  "src/pelicanbench/adapters.py",
  "src/pelicanbench/autonomous.py",
  "src/pelicanbench/canvas.py",
  "src/pelicanbench/contracts.py",
  "src/pelicanbench/candidate.py",
  "src/pelicanbench/empirical_nlp.py",
  "src/pelicanbench/human_study.py",
  "src/pelicanbench/pilot.py",
  "src/pelicanbench/prospective.py",
  "src/pelicanbench/qualification.py",
  "src/pelicanbench/simon_corpus.py",
  "src/pelicanbench/scoring.py",
  "src/pelicanbench/simulation.py",
  "src/pelicanbench/svg.py",
]
pytest_add_cli_args_test_selection = [
  "tests/unit",
  "tests/integration",
  "tests/e2e",
  "tests/property",
  "tests/mutation",
  "tests/edge",
  "tests/dst",
  "tests/agent",
  "tests/autonomous",
  "tests/test_metamorphic.py",
  "tests/test_svg_scoring.py",
  "tests/test_runner_manifest.py",
]
also_copy = [
  "benchmark/contracts",
  "benchmark/fixtures",
  "benchmark/tasks",
  "benchmark/evidence",
  "benchmark/human-calibration",
  "benchmark/judges",
  "benchmark/models",
  "data/derived",
  "data/fixtures",
]
mutate_only_covered_lines = true
max_stack_depth = 12
pytest_add_cli_args = ["-o", "addopts=-q"]
