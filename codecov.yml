codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
coverage:
  precision: 2
  round: down
  range: 90..100
  status:
    project:
      default:
        target: 90%
        threshold: 0.25%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 1%
        informational: false
flags:
  python-3.13:
    paths:
      - src/pelicanbench/
  python-3.14:
    paths:
      - src/pelicanbench/
comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
ignore:
  - "tests/**"
  - "scripts/**"
  - "hf/**"
  - "envs/**"
