name: Synchronize Conductor issues
on:
  push:
    branches: [main]
    paths:
      - '.github/issues/manifest.json'
      - 'conductor/tracks/**'
      - 'scripts/sync_github_issues.py'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_github_issues.py --apply
