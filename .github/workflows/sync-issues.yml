name: Synchronize Conductor issues
on:
  push:
    branches: [main]
    paths:
      - '.github/issues/manifest.json'
      - 'conductor/tracks/**'
      - 'scripts/sync_github_issues.py'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_github_issues.py --apply
