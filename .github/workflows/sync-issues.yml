name: Synchronize Conductor issues
on:
  push:
    branches: [main]
    paths:
      - '.github/issues/manifest.json'
      - 'conductor/tracks/**'
      - 'scripts/sync_github_issues.py'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_github_issues.py --apply
