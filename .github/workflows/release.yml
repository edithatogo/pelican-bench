name: Release validation
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.14'}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends inkscape
      - run: python -m pip install -e '.[dev,analysis]' build
      - run: bash scripts/harness.sh
      - name: Enforce release profile
        shell: bash
        run: |
          profile='v0.4-alpha'
          if [[ "$GITHUB_REF_NAME" == v1.* ]]; then
            profile='v1.0'
          fi
          python -m pelicanbench.cli release-readiness --profile "$profile"
      - name: Verify a clean clone at the tagged commit
        run: bash scripts/verify_clean_clone.sh "$GITHUB_REF_NAME" artifacts/clean-clone-receipt.json
      - run: python -m build
      - run: python scripts/generate_sbom.py --output dist/pelican-bench.spdx.json
      - name: Generate release manifest
        shell: bash
        run: |
          artifacts=()
          for path in dist/*.whl dist/*.tar.gz dist/*.spdx.json; do
            [[ -f "$path" ]] && artifacts+=(--artifact "$path")
          done
          python scripts/generate_release_manifest.py \
            --output dist/pelican-bench.release-manifest.json \
            --profile "$( [[ "$GITHUB_REF_NAME" == v1.* ]] && echo v1.0 || echo v0.4-alpha )" \
            --tag "$GITHUB_REF_NAME" \
            "${artifacts[@]}"
      - name: Build complete source, history, evidence, and publication package
        shell: bash
        run: |
          profile='v0.4-alpha'
          if [[ "$GITHUB_REF_NAME" == v1.* ]]; then
            profile='v1.0'
          fi
          python scripts/package_release.py \
            --output dist/complete-release \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --profile "$profile" \
            --clean-clone-receipt artifacts/clean-clone-receipt.json
      - name: Generate Python-distribution checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > dist/PYTHON_DISTRIBUTION_SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/pelican-bench.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find dist -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes
          fi
