name: Security
on:
  pull_request:
  schedule:
    - cron: '31 16 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.14'}
      - run: python -m pip install -e '.[dev]' pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r src scripts -x tests
      - name: SVG and scorer adversarial suite
        run: python -m pytest -q tests/test_svg_scoring.py tests/test_metamorphic.py tests/test_fuzzing.py
      - name: Bounded mutation fuzz campaign
        run: python -m pelicanbench.cli fuzz-svg --cases 520 --budget-ms 1000 --output artifacts/security-fuzz-report.json
