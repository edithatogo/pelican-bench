name: Nightly reproducibility and drift
on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[dev,analysis]'
      - run: bash scripts/harness.sh
      - run: python - <<'PY'
          from pelicanbench.drift import compare_distributions
          report=compare_distributions([0.42,0.61,0.84],[0.42,0.61,0.84])
          assert report.action == 'none'
          print(report)
          PY
