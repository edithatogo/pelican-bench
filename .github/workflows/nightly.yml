name: Nightly reproducibility and drift
on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.14'}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends inkscape
      - run: python -m pip install -e '.[dev,analysis]'
      - run: bash scripts/harness.sh
      - name: Frozen drift-control check
        run: |
          python - <<'PY'
          from pelicanbench.drift import compare_distributions
          report = compare_distributions([0.42, 0.61, 0.84], [0.42, 0.61, 0.84])
          assert report.action == 'none'
          print(report)
          PY
