name: Publish Hugging Face surfaces
on:
  workflow_dispatch:
    inputs:
      private:
        description: Publish private repositories
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hugging-face
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: '3.14'}
      - run: python -m pip install -e '.[hub]'
      - run: python -m pelicanbench.cli release-readiness --profile v0.2-alpha
      - name: Synchronize Hub repositories
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIVATE_REPOS: ${{ inputs.private }}
        shell: bash
        run: |
          args=(--apply)
          if [[ "$PRIVATE_REPOS" == "true" ]]; then
            args+=(--private)
          fi
          python scripts/setup_huggingface.py "${args[@]}"
