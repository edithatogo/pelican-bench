name: Publish Hugging Face surfaces
on:
  workflow_dispatch:
    inputs:
      private:
        description: Publish private repositories
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hugging-face
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[hub]'
      - name: Synchronize Hub repositories
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIVATE_REPOS: ${{ inputs.private }}
        shell: bash
        run: |
          args=(--apply)
          if [[ "$PRIVATE_REPOS" == "true" ]]; then
            args+=(--private)
          fi
          python scripts/setup_huggingface.py "${args[@]}"
