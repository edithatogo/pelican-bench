name: Mutation testing
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python scripts/mutation_smoke.py --output artifacts/mutation-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-smoke
          path: artifacts/mutation-smoke.json
  full-mutmut:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,analysis,mutation]'
      - name: Full configured mutation campaign
        run: mutmut run
      - name: Export mutation results
        if: always()
        run: |
          mkdir -p artifacts
          mutmut results > artifacts/mutmut-results.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutmut-results
          path: |
            artifacts/mutmut-results.txt
            mutants/
